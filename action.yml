name: cnc-ddraw
description: Builds the Rust cnc-ddraw ddraw.dll

inputs:
 release:
  description: 'Set to true to build the Release configuration'
  required: false
  default: 'true'
 debug:
  description: 'Set to true to build the Debug configuration'
  required: false
  default: 'false'

outputs:
 release:
  description: 'Full path to the Release ddraw.dll'
  value: ${{ steps.build-release.outputs.ddraw-dll }}
 release-pdb:
  description: 'Full path to the Release ddraw.pdb'
  value: ${{ steps.build-release.outputs.ddraw-pdb }}
 debug:
  description: 'Full path to the Debug ddraw.dll'
  value: ${{ steps.build-debug.outputs.ddraw-dll }}
 debug-pdb:
  description: 'Full path to the Debug ddraw.pdb'
  value: ${{ steps.build-debug.outputs.ddraw-pdb }}

runs:
 using: 'composite'
 steps:
 - name: Sanity checks
   run: |
        if [[ "${{ runner.os }}" != "Windows" ]]; then
          echo "[ERROR] This action can only be used on Windows"
          exit 1
        fi
        if [[ "${{ inputs.release }}" != "true" ]] && [[ "${{ inputs.debug }}" != "true" ]]; then
          echo "[ERROR] At least one of 'release' or 'debug' must be true"
          exit 1
        fi
        if [[ ! -f "$GITHUB_ACTION_PATH/Cargo.toml" ]]; then
          echo "[ERROR] Cargo workspace not found"
          exit 1
        fi
   shell: bash

 - name: Install Rust target
   run: rustup target add i686-pc-windows-msvc
   shell: bash

 - name: Build Release
   id: build-release
   run: |
        if [[ "${{ inputs.release }}" == "true" ]]; then
          echo "::group::Build Release"
          cargo build -p ddraw-dll --release --target i686-pc-windows-msvc
          mkdir -p "$GITHUB_ACTION_PATH/bin/Release"
          cp "$GITHUB_ACTION_PATH/target/i686-pc-windows-msvc/release/ddraw.dll" "$GITHUB_ACTION_PATH/bin/Release/ddraw.dll"
          if [[ -f "$GITHUB_ACTION_PATH/target/i686-pc-windows-msvc/release/ddraw.pdb" ]]; then
            cp "$GITHUB_ACTION_PATH/target/i686-pc-windows-msvc/release/ddraw.pdb" "$GITHUB_ACTION_PATH/bin/Release/ddraw.pdb"
          fi
          echo "ddraw-dll=$(cygpath --windows "$GITHUB_ACTION_PATH/bin/Release/ddraw.dll")" >> "$GITHUB_OUTPUT"
          echo "ddraw-pdb=$(cygpath --windows "$GITHUB_ACTION_PATH/bin/Release/ddraw.pdb")" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
        fi
   shell: bash
   working-directory: ${{ github.action_path }}

 - name: Build Debug
   id: build-debug
   run: |
        if [[ "${{ inputs.debug }}" == "true" ]]; then
          echo "::group::Build Debug"
          cargo build -p ddraw-dll --target i686-pc-windows-msvc
          mkdir -p "$GITHUB_ACTION_PATH/bin/Debug"
          cp "$GITHUB_ACTION_PATH/target/i686-pc-windows-msvc/debug/ddraw.dll" "$GITHUB_ACTION_PATH/bin/Debug/ddraw.dll"
          if [[ -f "$GITHUB_ACTION_PATH/target/i686-pc-windows-msvc/debug/ddraw.pdb" ]]; then
            cp "$GITHUB_ACTION_PATH/target/i686-pc-windows-msvc/debug/ddraw.pdb" "$GITHUB_ACTION_PATH/bin/Debug/ddraw.pdb"
          fi
          echo "ddraw-dll=$(cygpath --windows "$GITHUB_ACTION_PATH/bin/Debug/ddraw.dll")" >> "$GITHUB_OUTPUT"
          echo "ddraw-pdb=$(cygpath --windows "$GITHUB_ACTION_PATH/bin/Debug/ddraw.pdb")" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
        fi
   shell: bash
   working-directory: ${{ github.action_path }}
