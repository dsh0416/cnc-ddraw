[workspace]
members = [
    ".",
    "crates/shader-glslp",
    "crates/win32-hooks",
]
default-members = [
    ".",
    "crates/shader-glslp",
    "crates/win32-hooks",
]
resolver = "2"

[workspace.dependencies]
parking_lot = "0.12"
pollster = "0.4"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl", "glsl", "naga-ir"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectDraw",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[package]
name = "cnc-ddraw"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "ddraw"
crate-type = ["cdylib"]

[dependencies]
fearless_simd = "1.2.0"
parking_lot = { workspace = true }
pollster = { workspace = true }
raw-window-handle = "0.6.2"
shader-glslp = { path = "crates/shader-glslp" }
wgpu = { workspace = true }
win32-hooks = { path = "crates/win32-hooks" }
windows-core = { workspace = true }
windows = { workspace = true }

[profile.release]
lto = "thin"
debug = true
strip = "symbols"
