[package]
name = "cnc-ddraw"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "ddraw"
crate-type = ["cdylib"]

[dependencies]
fearless_simd = "1.2.0"
iced-x86 = { version = "1.20", default-features = false, features = ["std", "decoder", "instr_info"] }
naga = { version = "27.0.3", default-features = false, features = ["glsl-in"] }
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "unaligned"] }
parking_lot = "0.12"
png = "0.17"
pollster = "0.4"
raw-window-handle = "0.6.2"
retour = "=0.4.0-alpha.4"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl", "glsl", "naga-ir"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectDraw",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
debug = true
strip = "symbols"
