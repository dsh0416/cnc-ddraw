name: Build

on:
 push:
  branches:
  - 'master'
  - 'github-action'
 pull_request:

jobs:
 Build:
  runs-on: windows-latest
  steps:
  - name: Checkout cnc-ddraw
    uses: actions/checkout@v4

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable
    with:
     targets: i686-pc-windows-msvc

  - name: Test Rust workspace
    run: cargo test --workspace --target i686-pc-windows-msvc

  - name: Build Rust DLL
    id: build
    uses: ./
    with:
     release: true
     debug: true

  - name: Prepare artifacts
    run: |
         mkdir -p cnc-ddraw-release cnc-ddraw-debug cnc-ddraw-experimental

         cp "${{ steps.build.outputs.release }}" cnc-ddraw-release/
         if [[ -f "${{ steps.build.outputs.release-pdb }}" ]]; then
           cp "${{ steps.build.outputs.release-pdb }}" cnc-ddraw-release/
         fi

         rundll32.exe ./cnc-ddraw-release/ddraw.dll,DDIsWindowed

         cp "${{ steps.build.outputs.debug }}" cnc-ddraw-debug/
         if [[ -f "${{ steps.build.outputs.debug-pdb }}" ]]; then
           cp "${{ steps.build.outputs.debug-pdb }}" cnc-ddraw-debug/
         fi

         7z a -tzip -mm=Deflate -mfb=258 -mpass=15 "./cnc-ddraw-experimental/cnc-ddraw-experimental-release.zip" "./cnc-ddraw-release/*"
         7z a -tzip -mm=Deflate -mfb=258 -mpass=15 "./cnc-ddraw-experimental/cnc-ddraw-experimental-debug.zip" "./cnc-ddraw-debug/*"
    shell: bash

  - name: Upload release artifact
    uses: actions/upload-artifact@v4
    with:
     name: cnc-ddraw-release
     path: cnc-ddraw-release

  - name: Upload debug artifact
    uses: actions/upload-artifact@v4
    with:
     name: cnc-ddraw-debug
     path: cnc-ddraw-debug

  - name: Release experimental
    if: github.event_name == 'push'
    uses: softprops/action-gh-release@v1
    with:
     prerelease: true
     name: experimental
     tag_name: experimental
     files: cnc-ddraw-experimental/*
     fail_on_unmatched_files: true
     draft: true
