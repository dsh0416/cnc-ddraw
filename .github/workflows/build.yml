name: Rust Win32 DLL

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust i686 target and components
        run: |
          rustup target add i686-pc-windows-msvc
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release DLL and PDB
        run: cargo build --locked --release

      - name: Verify release outputs exist
        shell: pwsh
        run: |
          foreach ($file in @(
            "target/i686-pc-windows-msvc/release/ddraw.dll",
            "target/i686-pc-windows-msvc/release/ddraw.pdb"
          )) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing expected build output: $file"
              exit 1
            }
          }
          Get-Item target/i686-pc-windows-msvc/release/ddraw.dll, target/i686-pc-windows-msvc/release/ddraw.pdb |
            Format-Table Name, Length -AutoSize

      - name: Exercise the DLL through the x86 Windows SDK ABI
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /W4 tests\smoke.c user32.lib gdi32.lib /Fe:target\i686-pc-windows-msvc\release\smoke.exe
          if errorlevel 1 exit /b 1
          target\i686-pc-windows-msvc\release\smoke.exe

      - name: Upload DLL and PDB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ddraw-i686
          if-no-files-found: error
          path: |
            target/i686-pc-windows-msvc/release/ddraw.dll
            target/i686-pc-windows-msvc/release/ddraw.pdb
