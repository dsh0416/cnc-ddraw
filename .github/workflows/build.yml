name: Rust Win32 DLL
on: [push, pull_request]
jobs:
  win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add i686-pc-windows-msvc
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Exercise the DLL through the x86 Windows SDK ABI
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /W4 tests\smoke.c user32.lib gdi32.lib /Fe:target\i686-pc-windows-msvc\release\smoke.exe
          if errorlevel 1 exit /b 1
          target\i686-pc-windows-msvc\release\smoke.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cnc-ddraw-i686
          path: target/i686-pc-windows-msvc/release/ddraw.dll
