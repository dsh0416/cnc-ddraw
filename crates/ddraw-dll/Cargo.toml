[package]
name = "ddraw-dll"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "ddraw"
crate-type = ["cdylib"]

[dependencies]
ddraw-com = { path = "../ddraw-com" }
ddraw-core = { path = "../ddraw-core" }
ddraw-hooks = { path = "../ddraw-hooks" }
ddraw-platform = { path = "../ddraw-platform" }
ddraw-render = { path = "../ddraw-render" }
ddraw-render-d3d9 = { path = "../ddraw-render-d3d9" }
ddraw-render-gdi = { path = "../ddraw-render-gdi" }
ddraw-render-opengl = { path = "../ddraw-render-opengl" }

[build-dependencies]
embed-resource = "3.0.9"

[lints]
workspace = true
